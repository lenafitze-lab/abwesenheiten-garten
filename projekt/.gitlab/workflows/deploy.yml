name: Build and deploy

on:
  workflow_dispatch:

env:
  CODE_DIR: projekt
  REPO_NAME: abwesenheiten-garten

jobs:
  test_app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ${{ env.CODE_DIR }}/package-lock.json
      - name: Test the Angular app
        working-directory: ${{ env.CODE_DIR }}
        run: |
          npm ci
          npm run test

  build_app:
    runs-on: ubuntu-latest
    needs: test_app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ${{ env.CODE_DIR }}/package-lock.json
      - name: Build the Angular app
        working-directory: ${{ env.CODE_DIR }}
        run: |
          npm ci
          npm run build -- --base-href /${{ env.REPO_NAME }}/
          # GitHub Pages liefert 404.html bei unbekannten Pfaden -> SPA Deep Links
          cp www/index.html www/404.html
      - uses: actions/upload-artifact@v4
        with:
          name: www
          path: ${{ env.CODE_DIR }}/www/

  deploy_app:
    runs-on: ubuntu-latest
    needs: build_app
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
    concurrency: deploy
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: www
          path: www
      - uses: actions/upload-pages-artifact@v3
        with:
          path: www
      - uses: actions/deploy-pages@v4