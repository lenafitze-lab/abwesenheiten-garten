<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Rolle wählen</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="auth-content">
  <ion-avatar class="auth-badge">
    <ion-icon name="people-outline"></ion-icon>
  </ion-avatar>
  <h1 class="auth-heading">Fast geschafft</h1>
  <p class="auth-subheading">Wie möchtest du die App nutzen?</p>

  <ion-card class="auth-card">
    <ion-card-content>
      <ion-radio-group [value]="ausgewaehlteRolle()" (ionChange)="waehleRolle($event.detail.value)">
        <ion-item class="rolle-option" lines="none" [class.selected]="ausgewaehlteRolle() === 'Volti'">
          <ion-icon name="person-outline" slot="start"></ion-icon>
          <ion-radio value="Volti" justify="space-between">Volti</ion-radio>
        </ion-item>
        <ion-item class="rolle-option" lines="none" [class.selected]="ausgewaehlteRolle() === 'Eltern'">
          <ion-icon name="people-circle-outline" slot="start"></ion-icon>
          <ion-radio value="Eltern" justify="space-between">Eltern</ion-radio>
        </ion-item>
      </ion-radio-group>

      <ion-button expand="block" class="submit-button" [disabled]="!ausgewaehlteRolle()" (click)="weiter()">
        Weiter
      </ion-button>
    </ion-card-content>
  </ion-card>
</ion-content>
